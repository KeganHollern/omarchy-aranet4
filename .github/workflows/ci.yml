name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Check Python syntax and run unit tests
        run: |
          python -m compileall -q .
          python -m unittest discover -s . -p 'test_*.py' -v
      - name: Check snapshot rendering and setup
        run: |
          node test_snapshot.js
          node test_setup.js
      - name: Check plugin files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("manifest.json").read_text())
          assert manifest["schemaVersion"] == 1
          assert manifest["entryPoints"], "No plugin entry points"
          for entry in manifest["entryPoints"].values():
              path = Path(entry)
              assert not path.is_absolute() and ".." not in path.parts, entry
              assert path.is_file(), f"Missing entry point: {entry}"
          for path in Path("i18n").glob("*.json"):
              json.loads(path.read_text())
          PY
